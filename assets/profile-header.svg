<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Chauhan - AI Systems and Trust Engineering</title>
  <desc id="desc">A professional GitHub profile banner for Yash Chauhan focused on auditable AI, observability, and full-stack engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.54" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="156" y1="260" x2="1010" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.34"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.62"/>

  <g opacity="0.92">
    <path d="M96 262H1104" stroke="url(#line)" stroke-width="2"/>
    <path d="M96 265H1104" stroke="#020617" stroke-width="1" opacity="0.9"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="82" y="70" width="1036" height="210" rx="22" fill="#020617" fill-opacity="0.42" stroke="#334155"/>
  </g>

  <g transform="translate(118 96)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#0F766E" fill-opacity="0.22" stroke="#2DD4BF" stroke-opacity="0.55"/>
    <text x="18" y="21" fill="#99F6E4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">TRUST-FIRST AI</text>

    <text x="0" y="88" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">Yash Chauhan</text>
    <text x="0" y="132" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Full-stack AI systems, audit trails, observability, and model evaluation.</text>
    <text x="0" y="170" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Building software that can explain what it did, why it did it, and when it should refuse.</text>
  </g>

  <g transform="translate(822 94)">
    <rect x="0" y="0" width="240" height="44" rx="12" fill="#111827" stroke="#334155"/>
    <circle cx="26" cy="22" r="6" fill="#2DD4BF"/>
    <text x="48" y="28" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Grounded AI</text>

    <rect x="0" y="58" width="240" height="44" rx="12" fill="#111827" stroke="#334155"/>
    <circle cx="26" cy="80" r="6" fill="#60A5FA"/>
    <text x="48" y="86" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Governance Dashboards</text>

    <rect x="0" y="116" width="240" height="44" rx="12" fill="#111827" stroke="#334155"/>
    <circle cx="26" cy="138" r="6" fill="#F59E0B"/>
    <text x="48" y="144" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Fallback Systems</text>
  </g>
</svg>
