<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Live telemetry">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="cyanGlow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridT" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161B22" stroke-width="0.5"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif; }
      .dim { fill: #6E7681; } .soft { fill: #8B949E; } .text { fill: #C9D1D9; } .ttl { fill: #F0F6FC; }
      .cyan { fill: #38BDF8; } .amb { fill: #F59E0B; } .grn { fill: #10B981; } .red { fill: #F87171; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .scan { animation: scan 8s linear infinite; }
      .bar  { animation: rise 0.9s ease-out backwards; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.45; } }
      @keyframes scan  { 0% { transform: translateY(-10px); opacity: 0; } 8% { opacity: 0.6; } 92% { opacity: 0.6; } 100% { transform: translateY(540px); opacity: 0; } }
      @keyframes rise  { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bgT)"/>
  <rect width="1200" height="520" fill="url(#gridT)"/>

  <g stroke="#38BDF8" stroke-width="1.5" fill="none">
    <path d="M 14 14 L 14 44 M 14 14 L 44 14"/>
    <path d="M 1186 14 L 1186 44 M 1186 14 L 1156 14"/>
    <path d="M 14 506 L 14 476 M 14 506 L 44 506"/>
    <path d="M 1186 506 L 1186 476 M 1186 506 L 1156 506"/>
