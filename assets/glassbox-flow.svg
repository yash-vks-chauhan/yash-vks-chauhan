<svg width="980" height="156" viewBox="0 0 980 156" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GlassBox decision flow</title>
  <desc id="desc">A compact diagram showing a question moving through retrieval, verification, decision, and audit replay.</desc>

  <rect x="0.5" y="0.5" width="979" height="155" rx="12" fill="#0D1117" stroke="#30363D"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="28" y="34" fill="#E6EDF3" font-size="16" font-weight="700">GlassBox decision path</text>
    <text x="28" y="58" fill="#8B949E" font-size="13">Every answer should leave a trace that can be inspected later.</text>
  </g>

  <g transform="translate(28 86)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect width="126" height="42" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="18" y="26" fill="#C9D1D9" font-size="13" font-weight="600">Question</text>
    </g>

    <path d="M138 21H178" stroke="#484F58" stroke-width="1.5"/>
    <path d="M178 21L171 16V26L178 21Z" fill="#484F58"/>

    <g transform="translate(192 0)">
      <rect width="126" height="42" rx="8" fill="#132A27" stroke="#1F6F64"/>
      <text x="18" y="26" fill="#7EE7D3" font-size="13" font-weight="600">Retrieve</text>
    </g>

    <path d="M330 21H370" stroke="#484F58" stroke-width="1.5"/>
    <path d="M370 21L363 16V26L370 21Z" fill="#484F58"/>

    <g transform="translate(384 0)">
      <rect width="126" height="42" rx="8" fill="#172033" stroke="#2F5F9E"/>
      <text x="18" y="26" fill="#9CCBFF" font-size="13" font-weight="600">Verify</text>
    </g>

    <path d="M522 21H562" stroke="#484F58" stroke-width="1.5"/>
    <path d="M562 21L555 16V26L562 21Z" fill="#484F58"/>

    <g transform="translate(576 0)">
      <rect width="126" height="42" rx="8" fill="#2B2313" stroke="#8A6116"/>
      <text x="18" y="26" fill="#F2C56B" font-size="13" font-weight="600">Decide</text>
    </g>

    <path d="M714 21H754" stroke="#484F58" stroke-width="1.5"/>
    <path d="M754 21L747 16V26L754 21Z" fill="#484F58"/>

    <g transform="translate(768 0)">
      <rect width="126" height="42" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="18" y="26" fill="#C9D1D9" font-size="13" font-weight="600">Audit replay</text>
    </g>
  </g>
</svg>
