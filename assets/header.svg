<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Chauhan profile header</title>
  <desc id="desc">A clean system-style header for Yash Chauhan, focused on auditable AI systems and full-stack engineering.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" fill="none" stroke="#263241" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="96" y1="326" x2="1184" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="28" fill="#0D1117"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)" opacity="0.55"/>
  <rect x="56" y="48" width="1168" height="324" rx="24" fill="#111827" stroke="#303B4B"/>

  <g transform="translate(96 86)">
    <rect x="0" y="0" width="188" height="34" rx="17" fill="#10231F" stroke="#1E6058"/>
    <text x="18" y="22" fill="#5EEAD4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">AUDITABLE SYSTEMS</text>

    <text x="0" y="94" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">Yash Chauhan</text>
    <text x="0" y="139" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Full-stack AI, ML pipelines, observability, and product engineering.</text>
    <text x="0" y="180" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
      I build systems that can show their evidence, failure modes, and decision path.
    </text>

    <g transform="translate(0 224)">
      <rect x="0" y="0" width="134" height="34" rx="8" fill="#0B1220" stroke="#2F3B4A"/>
      <text x="18" y="22" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">GlassBox</text>
      <rect x="146" y="0" width="130" height="34" rx="8" fill="#0B1220" stroke="#2F3B4A"/>
      <text x="164" y="22" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Autoscaler</text>
      <rect x="288" y="0" width="118" height="34" rx="8" fill="#0B1220" stroke="#2F3B4A"/>
      <text x="306" y="22" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">CT U-Net</text>
    </g>
  </g>

  <g transform="translate(820 86)">
    <rect x="0" y="0" width="330" height="238" rx="18" fill="#0B1220" stroke="#344255"/>
    <rect x="18" y="18" width="294" height="34" rx="8" fill="#111827" stroke="#263241"/>
    <circle cx="38" cy="35" r="5" fill="#14B8A6"/>
    <circle cx="58" cy="35" r="5" fill="#3B82F6"/>
    <circle cx="78" cy="35" r="5" fill="#F59E0B"/>
    <text x="102" y="40" fill="#CBD5E1" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">glassbox.trace</text>

    <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13">
      <text x="28" y="86" fill="#64748B">question</text>
      <text x="118" y="86" fill="#E5E7EB">client allocation check</text>
      <text x="28" y="116" fill="#64748B">retrieve</text>
      <text x="118" y="116" fill="#5EEAD4">IPS + factsheet + rule text</text>
      <text x="28" y="146" fill="#64748B">verify</text>
      <text x="118" y="146" fill="#93C5FD">claim-by-claim support</text>
      <text x="28" y="176" fill="#64748B">decision</text>
      <text x="118" y="176" fill="#FBBF24">answer or refuse</text>
      <text x="28" y="206" fill="#64748B">audit</text>
      <text x="118" y="206" fill="#E5E7EB">replayable record</text>
    </g>
  </g>

  <path d="M96 326 H1184" stroke="url(#rule)" stroke-width="2"/>
</svg>
