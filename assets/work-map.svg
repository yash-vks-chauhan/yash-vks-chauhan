<svg width="980" height="118" viewBox="0 0 980 118" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yash Chauhan work map</title>
  <desc id="desc">A compact map of Yash Chauhan's engineering areas: AI systems, cloud operations, medical ML, and product engineering.</desc>
  <rect x="0.5" y="0.5" width="979" height="117" rx="10" fill="#0D1117" stroke="#30363D"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="28" y="32" fill="#E6EDF3" font-size="15" font-weight="700">Current engineering range</text>
    <text x="28" y="55" fill="#8B949E" font-size="13">Projects across AI systems, cloud operations, applied ML, and full-stack product work.</text>
  </g>

  <g transform="translate(28 74)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="194" height="28" rx="7" fill="#132A27" stroke="#1F6F64"/>
    <text x="18" y="19" fill="#7EE7D3">AI systems</text>

    <rect x="218" y="0" width="194" height="28" rx="7" fill="#172033" stroke="#2F5F9E"/>
    <text x="236" y="19" fill="#9CCBFF">Cloud / ops</text>

    <rect x="436" y="0" width="194" height="28" rx="7" fill="#2B2313" stroke="#8A6116"/>
    <text x="454" y="19" fill="#F2C56B">Medical ML</text>

    <rect x="654" y="0" width="240" height="28" rx="7" fill="#161B22" stroke="#30363D"/>
    <text x="672" y="19" fill="#C9D1D9">Product engineering</text>
  </g>
</svg>
