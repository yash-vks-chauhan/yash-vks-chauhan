<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Black box flight recorder">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="0.5" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <radialGradient id="reelHub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="0.6" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </radialGradient>
    <radialGradient id="ledRr" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#F87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledGr2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridB" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161B22" stroke-width="0.5"/>
    </pattern>
    <clipPath id="oscClip">
      <rect x="240" y="120" width="720" height="84"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif; }
      .dim { fill: #6E7681; } .soft { fill: #8B949E; } .text { fill: #C9D1D9; } .ttl { fill: #F0F6FC; }
      .cyan { fill: #38BDF8; } .amb { fill: #F59E0B; } .grn { fill: #10B981; } .red { fill: #F87171; }
      .term { fill: #10B981; }

      .pulseR { animation: pulseR 1.1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulseG { animation: pulseR 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .blink  { animation: blink 1.3s steps(1) infinite; }
      .scroll { animation: scroll 6s linear infinite; }
      .scrollSlow { animation: scroll 9s linear infinite; }
      .typecursor { animation: cursor 0.9s steps(1) infinite; }
      .glow   { filter: drop-shadow(0 0 4px #10B981); }
      @keyframes pulseR { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.55); opacity: 0.35; } }
      @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-800px); } }
      @keyframes cursor { 0%, 50% { opacity: 1; } 50.1%, 100% { opacity: 0; } }
    </style>

    <!-- reusable reel symbol · 8 spokes + hub -->
    <symbol id="reel" viewBox="-50 -50 100 100">
      <circle r="48" fill="url(#reelHub)" stroke="#1F2937"/>
      <circle r="46" fill="none" stroke="#161B22"/>
      <g stroke="#1F2937" stroke-width="2">
        <line x1="0" y1="-44" x2="0" y2="-12"/>
        <line x1="31" y1="-31" x2="9" y2="-9"/>
        <line x1="44" y1="0"   x2="12" y2="0"/>
        <line x1="31" y1="31"  x2="9" y2="9"/>
        <line x1="0" y1="44"   x2="0" y2="12"/>
        <line x1="-31" y1="31" x2="-9" y2="9"/>
        <line x1="-44" y1="0"  x2="-12" y2="0"/>
        <line x1="-31" y1="-31" x2="-9" y2="-9"/>
      </g>
      <circle r="12" fill="#0B0F14" stroke="#38BDF8" stroke-width="0.6"/>
      <circle r="2.5" fill="#38BDF8"/>
    </symbol>

    <!-- ECG-style heartbeat waveform · 800 wide tile · designed to loop -->
    <symbol id="ecgTile" overflow="visible">
      <path d="M 0 42
               L 60 42 L 70 42 L 80 42
               L 90 30 L 96 54 L 102 18 L 108 66 L 114 42
               L 200 42 L 210 42
               L 240 42 L 250 38 L 256 46 L 262 42
               L 360 42
               L 380 30 L 386 54 L 392 18 L 398 66 L 404 42
               L 500 42
               L 540 42 L 548 38 L 554 46 L 560 42
               L 660 42
               L 680 30 L 686 54 L 692 18 L 698 66 L 704 42
               L 800 42"
            fill="none" stroke="#10B981" stroke-width="1.6" class="glow"/>
    </symbol>
  </defs>

  <rect width="1200" height="360" fill="url(#bgB)"/>
  <rect width="1200" height="360" fill="url(#gridB)"/>

  <g stroke="#38BDF8" stroke-width="1.5" fill="none">
    <path d="M 14 14 L 14 44 M 14 14 L 44 14"/>
    <path d="M 1186 14 L 1186 44 M 1186 14 L 1156 14"/>
    <path d="M 14 346 L 14 316 M 14 346 L 44 346"/>
    <path d="M 1186 346 L 1186 316 M 1186 346 L 1156 346"/>
  </g>

  <!-- HEADER -->
  <text x="32" y="42" class="mono cyan" font-size="11" letter-spacing="6">[ FLIGHT RECORDER · CVR-01 ]</text>
  <text x="32" y="68" class="sans ttl"  font-size="22" font-weight="700">BLACK BOX · cockpit voice + data</text>
  <text x="32" y="86" class="mono soft" font-size="11">tape integrity verified · audit trail :: github.com/yash-vks-chauhan/commits</text>

  <!-- REC badge -->
  <g transform="translate(770 36)">
    <circle r="6" fill="url(#ledRr)"/>
    <circle r="3" class="red pulseR"/>
    <text x="14" y="4" class="mono red blink" font-size="11" letter-spacing="3">REC</text>
    <text x="48" y="4" class="mono dim" font-size="10" letter-spacing="2">// tape rolling</text>
  </g>

  <!-- top-right tape designation -->
  <g transform="translate(1166 42)" class="mono" font-size="10" text-anchor="end">
    <text class="dim" letter-spacing="2">TAPE</text>
    <text x="-44" y="0" class="text">yash-01 · seg-042</text>
  </g>

  <!-- ====== LEFT REEL ====== -->
  <g transform="translate(120 200)">
    <!-- shell -->
    <rect x="-78" y="-78" width="156" height="156" rx="6" fill="#0B0F14" stroke="#21262D"/>
    <text x="-72" y="-58" class="mono dim" font-size="8" letter-spacing="2">REEL-A · IN</text>
    <text x="68" y="-58" text-anchor="end" class="mono grn" font-size="8" letter-spacing="2">87%</text>
    <!-- rotating reel -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <use href="#reel" width="100" height="100" x="-50" y="-50"/>
    </g>
    <!-- tape edges (subtle) -->
    <line x1="38" y1="-30" x2="40" y2="30" stroke="#1F2937" stroke-width="3"/>
  </g>

  <!-- ====== RIGHT REEL ====== -->
  <g transform="translate(1080 200)">
    <rect x="-78" y="-78" width="156" height="156" rx="6" fill="#0B0F14" stroke="#21262D"/>
    <text x="-72" y="-58" class="mono dim" font-size="8" letter-spacing="2">REEL-B · OUT</text>
    <text x="68" y="-58" text-anchor="end" class="mono amb" font-size="8" letter-spacing="2">13%</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <use href="#reel" width="100" height="100" x="-50" y="-50"/>
    </g>
    <line x1="-40" y1="-30" x2="-38" y2="30" stroke="#1F2937" stroke-width="3"/>
  </g>

  <!-- tape strip connecting the reels (visual) -->
  <path d="M 160 170 Q 240 152 320 152 L 880 152 Q 960 152 1040 170" fill="none" stroke="#1F2937" stroke-width="2"/>
  <path d="M 160 232 Q 240 250 320 250 L 880 250 Q 960 250 1040 232" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- ====== CENTER : OSCILLOSCOPE PANEL ====== -->
  <g transform="translate(240 120)">
    <rect width="720" height="84" fill="#040711" stroke="#1F2937"/>
    <!-- center reference line -->
    <line x1="0" y1="42" x2="720" y2="42" stroke="#10B981" stroke-width="0.3" stroke-dasharray="2 4" opacity="0.4"/>
    <!-- ticks -->
    <g stroke="#1F2937" stroke-width="0.4">
      <line x1="120" y1="0" x2="120" y2="84"/>
      <line x1="240" y1="0" x2="240" y2="84"/>
      <line x1="360" y1="0" x2="360" y2="84"/>
      <line x1="480" y1="0" x2="480" y2="84"/>
      <line x1="600" y1="0" x2="600" y2="84"/>
    </g>
    <text x="10" y="12" class="mono dim" font-size="8" letter-spacing="2">OSC · MISSION HEARTBEAT</text>
    <text x="710" y="12" text-anchor="end" class="mono grn" font-size="8" letter-spacing="2">72 bpm · nominal</text>
  </g>

  <!-- scrolling ECG waveform (clipped to oscilloscope panel) -->
  <g clip-path="url(#oscClip)">
    <g class="scroll">
      <use href="#ecgTile" x="240" y="120"/>
      <use href="#ecgTile" x="1040" y="120"/>
    </g>
  </g>

  <!-- playback head indicator -->
  <line x1="600" y1="118" x2="600" y2="206" stroke="#F59E0B" stroke-width="1" opacity="0.7"/>
  <text x="600" y="115" text-anchor="middle" class="mono amb" font-size="8" letter-spacing="2">▼</text>

  <!-- ====== DATA PRINTOUT ====== -->
  <g transform="translate(240 222)">
    <rect width="720" height="100" fill="#040711" stroke="#1F2937"/>
    <text x="10" y="14" class="mono dim" font-size="8" letter-spacing="2">PRINTOUT · DECODED · CH-7</text>
    <text x="710" y="14" text-anchor="end" class="mono dim" font-size="8" letter-spacing="2">utf-8 · ascii fallback</text>

    <g transform="translate(12 30)" class="mono term" font-size="10">
      <text>&gt; callsign       : chauhan, y.  // crew of one</text>
      <text y="14">&gt; mission        : AI/ML systems that explain themselves</text>
      <text y="28">&gt; primary burn   : IIT-M research · Glassbox · Autoscaler</text>
      <text y="42">&gt; affiliation    : SRM IST · IIT Madras (R) · Hindalco (alumni)</text>
      <text y="56">&gt; integrity check: <tspan class="cyan">PASS</tspan> · log signed by github.com  <tspan class="amb typecursor">█</tspan></text>
    </g>
  </g>

  <!-- ====== BOTTOM STRIP ====== -->
  <g transform="translate(32 332)">
    <rect width="1136" height="14" fill="#0B0F14" stroke="#161B22"/>
    <text x="14" y="11" class="mono" font-size="10" letter-spacing="3">
      <tspan class="dim">LOG INTEGRITY </tspan><tspan class="grn">✓ verified</tspan>
      <tspan class="dim">  ·  AUDIT TRAIL </tspan><tspan class="text">github.com commits</tspan>
      <tspan class="dim">  ·  NEXT SAMPLE </tspan><tspan class="text">+6h</tspan>
      <tspan class="dim">  ·  SIGNAL LOCK </tspan><tspan class="grn">◉ green</tspan>
      <tspan class="dim">  ·  EOT </tspan><tspan class="amb">mission in progress</tspan>
    </text>
  </g>
</svg>
